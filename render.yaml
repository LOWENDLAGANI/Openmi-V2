# Render Blueprint for the web-agent run worker.
#
# A **Web Service** on the free plan, because that is the instance type Render
# gives away: the worker binds to `$PORT` and answers `GET /healthz`, and keeps
# polling the run queue behind it. It still receives no product traffic — the
# only route is the health check.
#
# Free-plan reality, stated plainly: a free Web Service sleeps after 15 minutes
# without inbound traffic. While it sleeps no run is claimed; queued runs wait
# and are executed on the next wake. If you want runs to start immediately, keep
# it awake with an external pinger every 5 minutes (UptimeRobot, cron-job.org)
# pointed at `/healthz`, or move to a paid instance.
#
# Artifacts still need the bucket: a free instance has no disk, and the web app
# runs on another host, so `RUN_ARTIFACT_DIR` could not be read back.

services:
  - type: web
    name: openmi-runs
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # A run may take up to RUN_MAX_MINUTES. Render sends SIGTERM and waits this
    # long (max 300) before killing the process; the worker stops claiming and
    # lets in-flight runs finish inside that window. Free instances may use a
    # shorter grace period than the value requested here.
    maxShutdownDelaySeconds: 300
    envVars:
      # ── Required ───────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Seals and opens the GitHub token; rotating it forces every account to
      # reconnect (the app says so).
      - key: GITHUB_TOKEN_KEY
        sync: false
      # At least one provider key. The browser never sees these.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: STRAITLY_API_KEY
        sync: false
      # A run needs a sandbox. Without this the worker claims the run and fails
      # it with "execution is not configured" — the row says exactly that.
      - key: E2B_API_KEY
        sync: false

      # ── Sandbox ────────────────────────────────────────────────────────────
      - key: EXECUTION_ENABLED
        value: "on"
      # The image a run boots from. `base` carries node, npm and git; a template
      # with bun/pnpm baked in and the CPU/memory/pid limits applied is the
      # production choice.
      - key: EXECUTION_TEMPLATE
        value: base
      - key: EXEC_NETWORK_MODE
        value: restricted

      # ── Limits and workspace lifetime ──────────────────────────────────────
      - key: RUN_MAX_MINUTES
        value: "15"
      # Pause the sandbox after 15 minutes (compute released, disk kept) and
      # destroy it 48 hours after the run settled.
      - key: RUN_SANDBOX_IDLE_MINUTES
        value: "15"
      - key: RUN_SANDBOX_TTL_HOURS
        value: "48"
      - key: RUN_WORKER_CONCURRENCY
        value: "1"

      # ── Artifacts ──────────────────────────────────────────────────────────
      # Required on Render: no disk, and the web app runs elsewhere. Use an
      # S3-compatible bucket (Cloudflare R2, S3, MinIO) and set all five.
      - key: RUN_ARTIFACTS_BUCKET
        sync: false
      - key: RUN_ARTIFACTS_ENDPOINT
        sync: false
      - key: RUN_ARTIFACTS_REGION
        value: auto
      - key: RUN_ARTIFACTS_ACCESS_KEY_ID
        sync: false
      - key: RUN_ARTIFACTS_SECRET_ACCESS_KEY
        sync: false
