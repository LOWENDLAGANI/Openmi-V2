# Render Blueprint for the web-agent run worker.
#
# One background worker, no public route. `render.yaml` is applied from the
# Render Dashboard (New + → Blueprint) or by pointing a new Background Worker at
# the repository and choosing Docker with `Dockerfile.worker`.
#
# Background workers have no free instance type. `starter` is 0.5 CPU / 512 MB;
# the worker itself is mostly waiting on a model stream, but two concurrent runs
# plus Bun want headroom, so `standard` (1 CPU / 2 GB) is the comfortable choice.
# Scaling out is adding instances, not changing code: claims are exclusive.

services:
  - type: worker
    name: openmi-runs
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: starter
    autoDeploy: true
    # A run may take up to RUN_MAX_MINUTES. Render sends SIGTERM and waits this
    # long (max 300) before killing the process; the worker stops claiming and
    # lets in-flight runs finish inside that window.
    maxShutdownDelaySeconds: 300
    envVars:
      # ── Required ───────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Seals and opens the GitHub token; rotating it forces every account to
      # reconnect (the app says so).
      - key: GITHUB_TOKEN_KEY
        sync: false
      # At least one provider key. The browser never sees these.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: STRAITLY_API_KEY
        sync: false
      # A run needs a sandbox. Without this the worker claims the run and fails
      # it with "execution is not configured" — the row says exactly that.
      - key: E2B_API_KEY
        sync: false

      # ── Sandbox ────────────────────────────────────────────────────────────
      - key: EXECUTION_ENABLED
        value: "on"
      # The image a run boots from. `base` carries node, npm and git; a template
      # with bun/pnpm baked in and the CPU/memory/pid limits applied is the
      # production choice.
      - key: EXECUTION_TEMPLATE
        value: base
      - key: EXEC_NETWORK_MODE
        value: restricted

      # ── Limits ─────────────────────────────────────────────────────────────
      - key: RUN_MAX_MINUTES
        value: "15"
      - key: RUN_WORKER_CONCURRENCY
        value: "2"

      # ── Artifacts ──────────────────────────────────────────────────────────
      # Required on Render: the worker's own disk is ephemeral, and the web app
      # runs elsewhere, so it could not read a local artifact directory. Use an
      # S3-compatible bucket (Cloudflare R2, S3, MinIO). Set all five or the
      # worker writes to a disk that disappears on the next deploy.
      - key: RUN_ARTIFACTS_BUCKET
        sync: false
      - key: RUN_ARTIFACTS_ENDPOINT
        sync: false
      - key: RUN_ARTIFACTS_REGION
        value: auto
      - key: RUN_ARTIFACTS_ACCESS_KEY_ID
        sync: false
      - key: RUN_ARTIFACTS_SECRET_ACCESS_KEY
        sync: false
